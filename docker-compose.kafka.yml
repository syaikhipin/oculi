# Strict-OSI alternative to docker-compose.yml (Apache Kafka 3.9, Apache-2.0).
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  oculi:
    build: .
    ports:
      - "8080:8080"
    environment:
      OCULI_DATA_DIR: /app/data
      OCULI_MODEL_DIR: /app/models
      OCULI_REDPANDA_BROKERS: kafka:9092
      OCULI_RUN_WORKERS: "1"
      OCULI_ENROLL_REQUIRES_LIVENESS: "1"
      OCULI_EVENT_RETENTION_DAYS: "30"
      OCULI_API_KEY: ${OCULI_API_KEY:?set OCULI_API_KEY before starting}
    volumes:
      - oculi_data:/app/data
      - oculi_models:/app/models
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  kafka_data:
  oculi_data:
  oculi_models:
